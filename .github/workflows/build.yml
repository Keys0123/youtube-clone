name: CI/CD Pipeline (Build & Deploy)

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      frontend_tag: ${{ steps.set-tags.outputs.frontend }}
      backend_tag: ${{ steps.set-tags.outputs.backend }}

    steps:
      - uses: actions/checkout@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Tags
        id: set-tags
        run: |
          FRONTEND_TAG=v.${{ github.run_number }}
          BACKEND_TAG=v.${{ github.run_number }}
          echo "frontend=$FRONTEND_TAG" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Frontends
        working-directory: frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/yt-frontend:${{ steps.set-tags.outputs.frontend }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/yt-frontend:${{ steps.set-tags.outputs.frontend }}

      - name: Build & Push Backend
        working-directory: backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/yt-backend:${{ steps.set-tags.outputs.backend }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/yt-backend:${{ steps.set-tags.outputs.backend }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Define variables from build job outputs
            FRONTEND_TAG=${{ needs.build.outputs.frontend_tag }}
            BACKEND_TAG=${{ needs.build.outputs.backend_tag }}
            
            cd /home/ubuntu/k8s

            # 2. Update the image tags in the YAML files
            # [^"]* matches the old tag version inside the quotes
            sed -i "s|image: \"umes122/yt-frontend:[^\"]*\"|image: \"umes122/yt-frontend:${FRONTEND_TAG}\"|g" frontend-deployment.yml
            sed -i "s|image: \"umes122/yt-backend:[^\"]*\"|image: \"umes122/yt-backend:${BACKEND_TAG}\"|g" backend-deployment.yml

            # 3. Verify the change in logs
            echo "Verifying image updates in YAML files:"
            grep "image:" frontend-deployment.yml
            grep "image:" backend-deployment.yml

            # 4. Apply to Kubernetes
            # We use sudo and --kubeconfig to fix the 'permission denied' error with K3s
            sudo kubectl apply -f frontend-deployment.yml --kubeconfig /etc/rancher/k3s/k3s.yaml
            sudo kubectl apply -f backend-deployment.yml --kubeconfig /etc/rancher/k3s/k3s.yaml

            # 5. Optional: Verify deployment status
            echo "Checking rollout status..."
            sudo kubectl rollout status deployment/frontend-deployment -n yt --kubeconfig /etc/rancher/k3s/k3s.yaml
            sudo kubectl rollout status deployment/backend-deployment -n yt --kubeconfig /etc/rancher/k3s/k3s.yaml
